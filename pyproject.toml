[project]
name = "aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK + FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "google-adk[db]==2.13.0",
    "fastapi",
    "uvicorn",
    "aiosqlite",
    "python-dotenv",
]

[project.scripts]
aurora-api = "aurora.api:main"
aurora-restore = "aurora.restore:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]
